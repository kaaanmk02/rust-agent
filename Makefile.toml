[project]
name = "rust-agent"

[tasks.run]
command = "cargo"
args = ["run", "--", "serve"]

[tasks.build]
command = "cargo"
args = ["build", "--release"]

[tasks.test]
command = "cargo"
args = ["test"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.fmt]
command = "cargo"
args = ["fmt"]
